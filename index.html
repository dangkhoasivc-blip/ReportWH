<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Báo Cáo Kho — SABECO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'sabeco-green': '#0a422a',
        'sabeco-green-light': '#1e5a40',
        'sabeco-green-pale': '#e8f0ec',
        'sabeco-gold': '#c9a13b',
        'sabeco-gold-light': '#e0bf62',
        'sabeco-bg': '#f8f9fa',
      },
      fontFamily: {
        'sans': ['Inter', 'Segoe UI', 'Roboto', 'Arial', 'sans-serif'],
        'mono': ['JetBrains Mono', 'Consolas', 'monospace'],
      }
    }
  }
}
</script>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
</head>
<body class="bg-sabeco-bg text-gray-800 h-screen flex overflow-hidden font-sans">

<!-- ============ SIDEBAR: DANH SÁCH BÁO CÁO ============ -->
<aside class="w-64 bg-sabeco-green text-white flex flex-col shadow-xl z-30 flex-shrink-0">
  <!-- Logo -->
  <div class="px-5 py-4 border-b border-white/10">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 bg-sabeco-gold rounded-md flex items-center justify-center text-sabeco-green font-extrabold text-lg flex-shrink-0">S</div>
      <div class="leading-tight">
        <h1 class="font-extrabold text-base tracking-wide">BÁO CÁO KHO</h1>
        <p class="text-[10px] text-sabeco-gold font-bold uppercase tracking-widest">SABECO Kho vận</p>
      </div>
    </div>
  </div>

  <!-- Tiêu đề danh sách -->
  <div class="px-4 py-3 border-b border-white/10 flex items-center gap-2">
    <i class="fas fa-folder-tree text-sabeco-gold text-xs"></i>
    <span class="text-xs font-bold uppercase tracking-wider text-sabeco-gold">Danh Sách Báo Cáo</span>
    <span class="ml-auto text-[10px] text-white/45" id="report-count"></span>
  </div>

  <!-- Danh sách báo cáo -->
  <nav class="flex-1 overflow-y-auto px-2.5 py-3 space-y-1.5" id="report-nav">
    <div class="text-center text-white/40 text-xs py-8">
      <i class="fas fa-circle-notch fa-spin mb-2 block text-lg"></i>
      Đang tải...
    </div>
  </nav>

  <!-- Footer sidebar -->
  <div class="px-4 py-3 border-t border-white/10 text-[10px] text-white/50 leading-relaxed">
    <div class="flex items-center gap-1.5">
      <div class="w-6 h-6 rounded-full bg-sabeco-gold text-sabeco-green flex items-center justify-center font-bold text-[10px]">KT</div>
      <div>
        <div class="text-white/80 font-semibold text-[11px]">Khoa Trương</div>
        <div>Phòng Kho vận</div>
      </div>
    </div>
  </div>
</aside>

<!-- ============ MAIN ============ -->
<main class="flex-1 flex flex-col h-full overflow-hidden min-w-0">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center flex-shrink-0 gap-4">
    <div class="min-w-0">
      <h2 class="text-lg font-extrabold text-sabeco-green flex items-center gap-2 truncate">
        <i class="fas fa-chart-column text-sabeco-gold"></i>
        HỆ THỐNG BÁO CÁO KHO
      </h2>
      <p class="text-xs text-gray-500 mt-0.5 truncate">Hệ thống đánh giá tổng quan số liệu hằng ngày cần theo dõi</p>
    </div>

    <div class="flex items-center gap-3 flex-shrink-0">
      <div class="hidden lg:flex flex-col items-end gap-1">
        <div class="bg-sabeco-green-pale border border-sabeco-green/15 text-gray-600 px-2.5 py-0.5 rounded text-xs">
          Cập nhật lần cuối: <span class="font-bold text-sabeco-green" id="update-date">--/--/----</span>
        </div>
        <div class="bg-sabeco-green-pale border border-sabeco-green/15 text-sabeco-green px-2.5 py-0.5 rounded text-xs font-mono font-bold">
          <span id="update-time">--:--:--</span>
        </div>
      </div>
      <button onclick="resetAllFilters()"
              class="px-3 py-2 bg-white border border-sabeco-green/25 text-sabeco-green rounded-md text-xs font-bold hover:bg-sabeco-green-pale transition flex items-center gap-2 whitespace-nowrap">
        <i class="fas fa-filter-circle-xmark"></i> Thao Tác Lại Bộ Lọc
      </button>
    </div>
  </header>

  <!-- Content scroll area -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3.5" id="scroll-area">

    <!-- Tiêu đề báo cáo đang xem -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm px-5 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4 min-w-0">
        <span class="font-mono text-2xl font-bold text-gray-200 select-none" id="report-index">02</span>
        <div class="min-w-0">
          <div class="flex items-center gap-2.5 flex-wrap">
            <h3 class="text-base font-extrabold text-gray-800 flex items-center gap-2" id="report-title">—</h3>
            <span class="row-chip" id="row-chip"></span>
          </div>
          <p class="text-xs text-gray-500 mt-0.5 truncate" id="report-desc">—</p>
        </div>
      </div>
      <button onclick="exportCurrentReport()" id="btn-export"
              class="px-3.5 py-2 bg-sabeco-green-pale text-sabeco-green border border-sabeco-green/25 rounded-md text-xs font-bold hover:bg-sabeco-green hover:text-white transition flex items-center gap-2 whitespace-nowrap flex-shrink-0">
        <i class="fas fa-download"></i> <span id="btn-export-label">Xuất Data Thô</span>
      </button>
    </section>

    <!-- BỘ LỌC của báo cáo đang xem -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm px-4 py-3" id="filter-section">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-[11px] font-extrabold uppercase tracking-wider text-sabeco-green flex items-center gap-1.5 mr-1">
          <i class="fas fa-sliders text-sabeco-gold"></i> Bộ Lọc
        </span>
        <div class="flex items-center gap-2 flex-wrap" id="filter-panel"></div>
      </div>
    </section>

    <!-- Vùng nội dung báo cáo -->
    <div id="report-body">
      <div class="bg-white rounded-lg border border-gray-200 p-16 text-center text-gray-400">
        <i class="fas fa-circle-notch fa-spin text-3xl mb-3 block"></i>
        Đang tải dữ liệu báo cáo...
      </div>
    </div>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
